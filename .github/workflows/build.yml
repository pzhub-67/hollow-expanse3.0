# Builds the mod jar in the cloud. Works without a Gradle wrapper.
# Push this folder to a GitHub repo, open the "Actions" tab, run "Build mod jar",
# then download the artifact: it contains the jar to upload to CurseForge.
name: Build mod jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hollow_expanse-jar
          path: build/libs/*.jar
