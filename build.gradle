plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian' version '1.+'
}

version = '1.0.0'
group = 'com.hollowexpanse'
archivesBaseName = 'hollow_expanse'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'parchment', version: '2024.11.10-1.21.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level.net.minecraftforge', 'DEBUG'
            mods {
                hollow_expanse {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level.net.minecraftforge', 'DEBUG'
            mods {
                hollow_expanse {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.21.1-52.1.0"
    implementation 'org.parchmentmc.data:parchment-1.21.1:2024.11.10@zip'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Hollow Expanse",
            "Specification-Vendor": "You",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "You"
        ])
    }
}

tasks.named('jar', Jar).configure {
    classifier = null
}